<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#9a7b20" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#1a0d33" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#040208" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="transparent"/>
  <circle cx="250" cy="250" r="230" fill="url(#ringGlow)"/>
  <!-- Concentric Astrolabe Rings -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#d4af37" stroke-width="0.7" stroke-dasharray="2,6" opacity="0.6"/>
  <circle cx="250" cy="250" r="225" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="1,4" opacity="0.7"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
  <circle cx="250" cy="250" r="90" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8"/>
  <circle cx="250" cy="250" r="45" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.9"/>
  <circle cx="250" cy="250" r="15" fill="#d4af37" opacity="0.9"/>
  <!-- Central Glowing Pulse -->
  <circle cx="250" cy="250" r="28" fill="none" stroke="#fff0be" stroke-width="1.5" opacity="0.7"/>

  <!-- Celestial Coordinate Axes & Radians -->
  <g stroke="#d4af37" stroke-width="0.8" opacity="0.45">
    <line x1="250" y1="10" x2="250" y2="490"/>
    <line x1="10" y1="250" x2="490" y2="250"/>
    <line x1="80" y1="80" x2="420" y2="420"/>
    <line x1="80" y1="420" x2="420" y2="80"/>
  </g>

  <!-- Sacred Geometry Metatron / Astrolabe Triangles -->
  <polygon points="250,50 423,350 77,350" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.4"/>
  <polygon points="250,450 77,150 423,150" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.4"/>

  <!-- Orbital planetary nodes -->
  <g fill="#d4af37">
    <circle cx="250" cy="50" r="4"/>
    <circle cx="423" cy="350" r="4"/>
    <circle cx="77" cy="350" r="4"/>
    <circle cx="250" cy="450" r="4"/>
    <circle cx="77" cy="150" r="4"/>
    <circle cx="423" cy="150" r="4"/>
    
    <!-- Intermediate orbital points -->
    <circle cx="340" cy="160" r="3" fill="#fff0be"/>
    <circle cx="160" cy="340" r="3" fill="#fff0be"/>
    <circle cx="370" cy="290" r="2.5" fill="#f3e5ab"/>
    <circle cx="130" cy="210" r="2.5" fill="#f3e5ab"/>
  </g>

  <!-- Degree marks around 200r ring -->
  <g stroke="#d4af37" stroke-width="0.75" opacity="0.7">
    <line x1="250" y1="20" x2="250" y2="28"/>
    <line x1="250" y1="472" x2="250" y2="480"/>
    <line x1="20" y1="250" x2="28" y2="250"/>
    <line x1="472" y1="250" x2="480" y2="250"/>
  </g>

  <!-- Monospace Coordinate Readouts on Astrolabe -->
  <text x="256" y="85" font-family="monospace" font-size="7" fill="#d4af37" opacity="0.8">R_α: 1.414 // Φ</text>
  <text x="350" y="245" font-family="monospace" font-size="7" fill="#d4af37" opacity="0.8">θ: 092.4°</text>
  <text x="140" y="265" font-family="monospace" font-size="7" fill="#d4af37" opacity="0.8">Δt: 0.003ms</text>
  <text x="256" y="420" font-family="monospace" font-size="7" fill="#d4af37" opacity="0.8">HERMES_NEXUS</text>
</svg>